    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reactflow@11.11.3/dist/style.css" />
    <style>
      /* Styles spécifiques au mode sombre et aux formes d'organigramme */
      .clip-diamond {
        clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      }

      /* Masquage des bordures par défaut de React Flow pour les nœuds personnalisés */
      .react-flow__node {
        background: transparent !important;
        border: none !important;
        padding: 0 !important;
        box-shadow: none !important;
      }

      /* Custom styles for React Flow handles */
      .react-flow__handle {
        width: 10px !important;
        height: 10px !important;
        background-color: #6366f1 !important; /* indigo-500 */
        border: 2px solid #ffffff !important;
        border-radius: 50% !important;
        transition: opacity 0.2s ease, transform 0.2s ease;
        opacity: 0; /* Caché par défaut */
      }
      
      /* Faire apparaître les points au survol de la forme ou lors d'une connexion */
      .react-flow__node:hover .react-flow__handle,
      .react-flow__handle-connecting,
      .react-flow__handle-valid {
        opacity: 1 !important;
      }

      .react-flow__handle:hover {
        transform: scale(1.5);
        background-color: #818cf8 !important; /* indigo-400 */
        opacity: 1 !important;
      }

      /* Animation classes */
      @keyframes scale-in {
        from { transform: scale(0.9); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }
      .animate-scale-in {
        animation: scale-in 0.2s ease-out forwards;
      }

      @keyframes fade-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fade-in 0.3s ease-out forwards;
      }

      /* Scrollbar dark theme */
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: #0f172a; }
      ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #475569; }

      /* React Flow Overrides */
      .react-flow__controls button {
        background-color: #1e293b !important;
        border-bottom: 1px solid #334155 !important;
        fill: #94a3b8 !important;
      }
      .react-flow__controls button:hover {
        background-color: #334155 !important;
      }
      .react-flow__minimap {
        background-color: #0f172a !important;
        border-radius: 12px;
        overflow: hidden;
      }
